<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minderal Core</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // PouchDB and its plugins reach for Node globals. Supply the two they
      // actually use, before any module loads.
      window.global ||= window
      window.process ||= {
        env: {},
        browser: true,
        nextTick: (fn, ...args) => queueMicrotask(() => fn(...args))
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
