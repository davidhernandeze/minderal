services:
  couchdb:
    image: couchdb:3.4
    ports:
      - '5984:5984'
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: password
    volumes:
      - ./couchdb/local.ini:/opt/couchdb/etc/local.d/01-minderal.ini:ro
    tmpfs:
      - /opt/couchdb/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5984/_up']
      interval: 2s
      timeout: 3s
      retries: 20
