; Mounted read-only into /opt/couchdb/etc/local.d/. The name sorts before the
; image's docker.ini on purpose: CouchDB persists runtime config (the admin
; hash, the auth secret) into the last file it loads, and that must not be this
; one.
[chttpd]
enable_cors = true

[cors]
; With credentials = true CouchDB echoes the request's Origin rather than
; returning a literal *, which is what credentialed CORS requires. This keeps
; the browser working whatever port the dev server lands on. Development only.
origins = *
credentials = true
headers = accept, authorization, content-type, origin, referer, x-csrf-token
methods = GET, PUT, POST, HEAD, DELETE

[couch_httpd_auth]
; 400 days. The default is 600 seconds, which expires the AuthSession cookie out
; from under a live changes feed or a long-running replication.
;
; CouchDB itself has no practical ceiling here — it accepts values that put the
; Expires date in the year 5000 — but browsers clamp a cookie's lifetime to 400
; days, so anything larger only affects non-browser clients and makes the number
; misleading. This is also only an *idle* limit: every authenticated response
; re-issues the cookie, so an active client never reaches it.
;
; Revocation is by rotating chttpd_auth.secret, which 401s every outstanding
; cookie at once.
timeout = 34560000
allow_persistent_cookies = true
