; Test-only CouchDB configuration, mounted into /opt/couchdb/etc/local.d/.
; Not read-only: the image entrypoint chowns everything under /opt/couchdb.
; The file name sorts before the image's docker.ini, which must stay last because
; CouchDB persists runtime config (admin hash, auth secret) into the last file it loads.

[couchdb]
; Creates _users and _replicator on boot instead of logging errors about them.
single_node = true

[chttpd]
enable_cors = true

[cors]
; Browser tests run on a random localhost port; with credentials = true CouchDB echoes
; the request Origin instead of a literal *, which credentialed CORS requires.
origins = *
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE

[chttpd_auth_lockout]
; CouchDB 3.4 locks an account after repeated failed logins. Tests log in with wrong
; credentials on purpose and run many times in a row; a locked admin fails every suite after.
mode = off
